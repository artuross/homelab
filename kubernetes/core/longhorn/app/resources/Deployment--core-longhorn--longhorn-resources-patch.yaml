apiVersion: apps/v1
kind: Deployment
metadata:
  name: longhorn-driver-deployer
  namespace: core-longhorn
spec:
  template:
    spec:
      containers:
        - name: longhorn-driver-deployer
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 96Mi
      initContainers:
        - name: wait-longhorn-manager
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 32Mi
